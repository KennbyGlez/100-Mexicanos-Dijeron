<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>100 Mexicanos Dijeron</title>

    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: radial-gradient(circle at top, #1e3a8a, #000);
        color: white;
        overflow-x: hidden;
      }

      header {
        text-align: center;
        padding: 20px;
      }

      h1 {
        font-size: 40px;
        color: gold;
        text-shadow: 0 0 20px gold;
        margin: 0;
      }

      .container {
        display: grid;
        grid-template-columns: 1fr 3fr;
        gap: 20px;
        padding: 20px;
      }

      .panel {
        background: rgba(0, 0, 0, 0.4);
        padding: 15px;
        border-radius: 15px;
      }

      .score {
        font-size: 40px;
        text-align: center;
        color: gold;
      }

      .turnoBox {
        margin: 15px 0;
        padding: 10px;
        background: rgba(255, 215, 0, 0.15);
        border: 2px solid gold;
        border-radius: 10px;
        text-align: center;
        font-weight: bold;
        font-size: 18px;
        color: gold;
      }

      .question {
        background: linear-gradient(90deg, gold, orange);
        color: black;
        padding: 20px;
        font-size: 24px;
        font-weight: bold;
        text-align: center;
        border-radius: 15px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
        margin-top: 20px;
      }

      .card {
        background: #1e40af;
        height: 120px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 40px;
        font-weight: bold;
        border-radius: 15px;
        cursor: pointer;
        transition: transform 0.3s;
        position: relative;
      }

      .card:hover {
        transform: scale(1.05);
      }

      .card.revealed {
        background: gold;
        color: black;
        font-size: 18px;
        flex-direction: column;
      }

      .controls {
        margin-top: 20px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      button {
        padding: 10px 15px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-weight: bold;
      }

      .green {
        background: green;
        color: white;
      }
      .red {
        background: red;
        color: white;
      }
      .blue {
        background: #2563eb;
        color: white;
      }
      .orange {
        background: orange;
      }

      .errors {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-top: 10px;
      }

      .x {
        font-size: 30px;
        color: red;
      }

      .intro {
        position: fixed;
        inset: 0;
        background: black;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        z-index: 10;
      }

      .intro h1 {
        font-size: 60px;
      }

      #winner h1 {
        font-size: 70px;
        color: gold;
        text-shadow: 0 0 30px gold;
      }

      @keyframes parpadeo {
        0% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.5;
          transform: scale(1.03);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }

      .bigError {
        position: fixed;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 200px;
        font-weight: bold;
        color: red;
        text-shadow:
          0 0 20px red,
          0 0 40px red,
          0 0 80px red;
        background: rgba(0, 0, 0, 0.45);
        z-index: 9999;

        opacity: 0;
        pointer-events: none;
        transform: scale(0.3);

        transition:
          opacity 0.2s,
          transform 0.2s;
      }

      .bigError.show {
        opacity: 1;
        transform: scale(1);
      }

      .bigError.double {
        font-size: 200px;
      }

      .bigError.triple {
        font-size: 200px;
      }

      .teamInput {
        width: 100%;
        padding: 10px;
        border-radius: 10px;
        border: 2px solid gold;
        background: rgba(255, 255, 255, 0.1);
        color: white;
        font-size: 24px;
        font-weight: bold;
        text-align: center;
        outline: none;
        box-sizing: border-box;
      }

      .teamInput:focus {
        box-shadow: 0 0 15px gold;
      }
    </style>
  </head>

  <body>
    <div class="intro" id="intro">
      <h1>100 MEXICANOS DIJERON</h1>
      <p>Cargando juego...</p>
    </div>

    <div class="intro" id="winner" style="display: none">
      <h1 id="winnerText">GANADOR</h1>
      <p id="finalScore"></p>
      <button class="green" onclick="resetGame()">Jugar otra vez</button>
    </div>

    <header>
      <h1>100 Mexicanos Dijeron</h1>
    </header>

    <div class="container">
      <div class="panel">
        <h2>
          <input
            type="text"
            id="team1Name"
            value="Equipo 1"
            class="teamInput"
            oninput="updateTeamNames()"
          />
        </h2>

        <div class="score" id="score1">0</div>

        <h2 style="margin-top: 20px">
          <input
            type="text"
            id="team2Name"
            value="Equipo 2"
            class="teamInput"
            oninput="updateTeamNames()"
          />
        </h2>

        <div class="score" id="score2">0</div>

        <div class="turnoBox" id="turnoBox">🔥 Turno actual: Equipo 1</div>

        <hr />

        <h3>Errores</h3>
        <div class="errors" id="errors">
          <div class="x">❌</div>
          <div class="x">❌</div>
          <div class="x">❌</div>
        </div>

        <button class="red" onclick="addError()">Error</button>
        <!--  <button class="blue" onclick="resetErrors()">Reiniciar errores</button> -->
      </div>

      <div>
        <div class="question" id="question">
          Menciona algo que haces al despertar
        </div>

        <div class="grid" id="grid"></div>

        <div class="controls">
          <!-- <button class="green" onclick="sumPoints()">Sumar puntos</button> -->
          <button class="blue" onclick="switchTeam()">
            Cambiar turno de equipo
          </button>
          <button class="orange" onclick="nextQuestion()">
            Siguiente pregunta
          </button>
          <button class="red" onclick="resetGame()">Reiniciar juego</button>
          <div
            id="stealAlert"
            style="
              display: none;
               flex-basis: 100%;
              margin-top: 15px;
              padding: 15px;
              background: rgba(255, 0, 0, 0.2);
              border: 3px solid red;
              border-radius: 12px;
              text-align: center;
              font-size: 24px;
              font-weight: bold;
              color: #ff4d4d;
              animation: parpadeo 0.8s infinite;
            "
          >
            ⚠️ TIMBACK ⚠️<br />
            ¡El otro equipo puede robar los puntos si hay otro error!
          </div>
        </div>
      </div>
    </div>

    <script>
      let questions = [];

      async function init() {
        try {
          questions = await cargarDesdeCSV();

          if (!questions || questions.length === 0) {
            alert("No se cargaron preguntas del CSV");
            return;
          }

          loadQuestion();
          updateScores();
          updateErrors();
          updateTurno();
        } catch (e) {
          console.error(e);
          alert("Error cargando preguntas");
        }
      }

      let juegoIniciado = false;

      document
        .getElementById("intro")
        .addEventListener("click", async function iniciarJuego() {
          if (juegoIniciado) return;
          juegoIniciado = true;

          sonidos.jugar.currentTime = 0;
          sonidos.jugar.play().catch(() => {});

          try {
            questions = await cargarDesdeCSV();

            if (!questions || questions.length === 0) {
              alert("No se cargaron preguntas del CSV");
              return;
            }

            qIndex = 0;
            loadQuestion();
            updateScores();
            updateErrors();
            updateTurno();

            document.getElementById("intro").style.display = "none";
          } catch (e) {
            console.error(e);
            alert("Error cargando preguntas");
          }
        });

      let qIndex = 0;
      let revealed = [];
      let score1 = 0;
      let score2 = 0;
      let team = 1;
      let errors = 0;
      let stealing = false;
      let previousTeam = 1;
      let roundClosed = false;
      let team1Name = "Equipo 1";
      let team2Name = "Equipo 2";

      const sonidos = {
        correcto: new Audio("sonidos/correcto-100-mexicanos-dijeron.mp3"),
        incorrecto: new Audio("sonidos/incorrecto-100-mexicanos-dijeron.mp3"),
        ganador: new Audio("sonidos/ganador-100.mp3"),
        jugar: new Audio("sonidos/a-jugar-100-mexicanos-dijeron.mp3"),
      };

      const ctx = new (window.AudioContext || window.webkitAudioContext)();

      function beep(freq) {
        const o = ctx.createOscillator();
        const g = ctx.createGain();

        o.connect(g);
        g.connect(ctx.destination);

        o.frequency.value = freq;
        o.start();

        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.2);
        o.stop(ctx.currentTime + 0.2);
      }

      function updateTeamNames() {
        team1Name = document.getElementById("team1Name").value || "Equipo 1";
        team2Name = document.getElementById("team2Name").value || "Equipo 2";

        updateTurno();
      }

      function showBigError() {
        const bigError = document.getElementById("bigError");

        // limpiar clases anteriores
        bigError.className = "bigError";

        // tamaño dependiendo de errores
        if (errors === 1) {
          bigError.innerHTML = "❌";
        }

        if (errors === 2) {
          bigError.innerHTML = "❌❌";
          bigError.classList.add("double");
        }

        if (errors === 3) {
          bigError.innerHTML = "❌❌❌";
          bigError.classList.add("triple");
        }

        bigError.classList.add("show");

        setTimeout(() => {
          bigError.classList.remove("show");
        }, 1200);
      }

      function updateTurno() {
        const currentTeamName = team === 1 ? team1Name : team2Name;

        document.getElementById("turnoBox").innerText =
          "🔥 Turno actual: " + currentTeamName;
      }

      function renderQuestionNumber() {
        const q = questions[qIndex];
        const numero = qIndex + 1;

        document.getElementById("question").innerHTML =
          `<b>Pregunta ${numero}:</b> ${q.q}`;
      }

      function loadQuestion() {
        const q = questions[qIndex];

        roundClosed = false;

        renderQuestionNumber(); // 👈 AQUI EL CAMBIO

        const grid = document.getElementById("grid");
        grid.innerHTML = "";
        revealed = [];

        q.a.forEach((item, i) => {
          const [text, pts] = item;

          // ❌ si está vacío, no crear card
          if (!text || text.trim() === "") return;

          const div = document.createElement("div");
          div.className = "card";
          div.innerText = i + 1;

          div.onclick = () => reveal(i, div);

          grid.appendChild(div);
        });
      }
      function switchTeam() {
        team = team === 1 ? 2 : 1;
        updateTurno();
        beep(300);
      }

      function addError() {
        if (errors >= 3) return;

        // 🔥 SI ESTÁN ROBANDO Y FALLAN
        if (stealing) {
          let total = 0;
          const q = questions[qIndex];

          revealed.forEach((i) => {
            total += q.a[i][1];
          });

          // puntos para el equipo original
          if (previousTeam === 1) score1 += total;
          else score2 += total;

          updateScores();
          sonidos.incorrecto.currentTime = 1.4;
          sonidos.incorrecto.play().catch(() => {});

          /* alert(
            "❌ ROBO FALLIDO\n\nLos puntos regresan al Equipo " + previousTeam,
          ); */

          stealing = false;
          roundClosed = true;

          resetErrors();

          sonidos.ganador.currentTime = 0;
          sonidos.ganador.play().catch(() => {});

          return;
        }

        errors++;
        updateErrors();
        showBigError();

        sonidos.incorrecto.currentTime = 1.4;
        sonidos.incorrecto.play().catch(() => {});

        // ⚠️ Aviso de robo
        if (errors === 2) {
          const alertBox = document.getElementById("stealAlert");

          alertBox.style.display = "block";

          beep(120);
          setTimeout(() => beep(100), 200);
          setTimeout(() => beep(80), 400);
        }

        // ❌ 3 errores → cambia turno para robar
        if (errors === 3) {
          setTimeout(() => {
            previousTeam = team;

            switchTeam();

            stealing = true;
            //errors = 0;

            document.getElementById("stealAlert").style.display = "none";

            /* alert(
              "🔥 MODO ROBO 🔥\n\nEquipo " +
                team +
                " tiene una oportunidad para robar los puntos.",
            ); */

            resetErrors();
          }, 800);
        }
      }

      function resetErrors() {
        errors = 0;
        updateErrors();
        document.getElementById("stealAlert").style.display = "none";
        beep(400);
      }

      function nextQuestion() {
        // si es la última pregunta → mostrar ganador
        if (qIndex >= questions.length - 1) {
          showWinner();
          return;
        }

        qIndex++;
        errors = 0;
        stealing = false;
        updateErrors();
        document.getElementById("stealAlert").style.display = "none";
        loadQuestion();

        sonidos.jugar.currentTime = 0;
        sonidos.jugar.play().catch(() => {});
      }

      function showWinner() {
        let winnerText = "";

        if (score1 > score2)
          winnerText = "🔥 GANA " + team1Name.toUpperCase() + " 🔥";
        else if (score2 > score1)
          winnerText = "🔥 GANA " + team2Name.toUpperCase() + " 🔥";
        else winnerText = "⚖️ EMPATE ⚖️";

        document.getElementById("winnerText").innerText = winnerText;

        document.getElementById("finalScore").innerText =
          `${team1Name}: ${score1} pts | ${team2Name}: ${score2} pts`;

        document.getElementById("winner").style.display = "flex";

        sonidos.ganador.currentTime = 0;
        sonidos.ganador.play().catch(() => {});
      }
      function resetGame() {
        score1 = 0;
        score2 = 0;
        errors = 0;
        qIndex = 0;
        team = 1;
        updateScores();
        updateErrors();
        updateTurno();
        loadQuestion();
        document.getElementById("winner").style.display = "none";
      }

      function updateScores() {
        document.getElementById("score1").innerText = score1;
        document.getElementById("score2").innerText = score2;
      }

      function updateErrors() {
        document.querySelectorAll(".x").forEach((x, i) => {
          x.style.opacity = i < errors ? 1 : 0.2;
        });
      }

      document.addEventListener("click", function startAudio() {
        sonidos.jugar.currentTime = 0;
        sonidos.jugar.play().catch(() => {});
        document.removeEventListener("click", startAudio);
      });

      loadQuestion();
      updateScores();
      updateErrors();
      updateTurno();

      async function cargarDesdeCSV() {
        const res = await fetch("data/preguntas.csv");
        const text = await res.text();

        const rows = text.split("\n").slice(1);

        const preguntas = rows.map((row) => {
          const cols = row.split(",");

          return {
            q: cols[0],
            a: [
              [cols[1], Number(cols[2])],
              [cols[3], Number(cols[4])],
              [cols[5], Number(cols[6])],
              [cols[7], Number(cols[8])],
            ],
          };
        });

        return preguntas;
      }

      function reveal(i, div) {
        if (revealed.includes(i)) return;

        const q = questions[qIndex];
        const [text, pts] = q.a[i];

        div.classList.add("revealed");
        div.innerHTML = `<b>${text}</b><br>${pts} pts`;

        revealed.push(i);

        sonidos.correcto.currentTime = 0;
        sonidos.correcto.play().catch(() => {});

        // 🚫 Si la ronda ya terminó,
        // solo mostrar respuestas sin sumar puntos
        if (roundClosed) {
          return;
        }

        // 🔥 ROBO EXITOSO
        if (stealing) {
          let total = 0;

          revealed.forEach((index) => {
            total += q.a[index][1];
          });

          if (team === 1) score1 += total;
          else score2 += total;

          updateScores();

          sonidos.ganador.currentTime = 0;
          sonidos.ganador.play().catch(() => {});

          // ✅ cerrar ronda
          roundClosed = true;

          stealing = false;

          resetErrors();

          return;
        }

        // ✅ TODAS LAS RESPUESTAS REVELADAS
        const respuestasValidas = q.a.filter(
          ([text]) => text && text.trim() !== "",
        ).length;

        if (revealed.length === respuestasValidas) {
          let total = 0;

          revealed.forEach((index) => {
            total += q.a[index][1];
          });

          if (team === 1) score1 += total;
          else score2 += total;

          updateScores();

          sonidos.ganador.currentTime = 0;
          sonidos.ganador.play().catch(() => {});

          // ✅ cerrar ronda
          roundClosed = true;

          resetErrors();
        }
      }

      function sumPoints() {
        const q = questions[qIndex];
        let total = 0;

        revealed.forEach((i) => {
          total += q.a[i][1];
        });

        if (total === 0) return;

        // 🔥 SI ES ROBO
        if (stealing) {
          if (team === 1) score1 += total;
          else score2 += total;

          updateScores();

          sonidos.ganador.currentTime = 0;
          sonidos.ganador.play().catch(() => {});

          alert(
            "🔥 ROBO EXITOSO 🔥\n\nEquipo " +
              team +
              " robó " +
              total +
              " puntos.",
          );

          stealing = false;

          return;
        }

        // normal
        if (team === 1) score1 += total;
        else score2 += total;

        updateScores();

        sonidos.ganador.currentTime = 0;
        sonidos.ganador.play().catch(() => {});
      }

      updateTurno();
    </script>
  </body>
  <div id="bigError" class="bigError">❌</div>
</html>
